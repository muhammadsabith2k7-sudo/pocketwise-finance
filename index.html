<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Take control of your money, one entry at a time."><title>PocketWise</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><div class="eyebrow">Personal dashboard</div><h1>PocketWise</h1><p class="muted">Take control of your money, one entry at a time.</p></div><span class="pill">Offline • Private</span></header><div class="grid"><section class="card"><div class="muted">Income</div><div class="metric" id="s0">0</div></section><section class="card"><div class="muted">Expenses</div><div class="metric" id="s1">0</div></section><section class="card"><div class="muted">Balance</div><div class="metric" id="s2">0</div></section></div><section class="card"><h2>Add new</h2><form><input id="desc" placeholder="Description" maxlength="70" required><input id="amount" type="number" min="0.01" step="0.01" placeholder="Amount (₹)" required><select id="type"><option value="expense">Expense</option><option value="income">Income</option></select><button>Add transaction</button></form></section><section class="card" style="margin-top:18px"><h2>Recent transactions</h2><ul id="list"></ul></section><footer>Data is saved in this browser using localStorage. No account or server needed.</footer></main><script src="app.js"></script></body></html>
